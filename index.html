<html lang="th" translate="no">
<head>
<meta charset="utf-8">

<title>สตูดิโอพากย์เสียงส่วนตัว (V6 ไม่ต้องรอคิว)</title>
<script>
var clips = [], isRec = false, tId = null, t0 = 0, hasVid = false;
var audioCtx = null, mediaStream = null, sourceNode = null, processorNode = null, pcmData = [], sampleRate = 44100;

function tab(n) {
  for (var i = 1; i <= 3; i++) {
    document.getElementById('p' + i).style.display = (i === n) ? 'block' : 'none';
    document.getElementById('b' + i).style.background = (i === n) ? '#2563eb' : '#e2e8f0';
    document.getElementById('b' + i).style.color = (i === n) ? '#fff' : '#0f172a';
  }
}

function syncPrompt() {
  var val = document.getElementById('script-in').value;
  document.getElementById('prompt-box').innerText = val || 'พิมพ์บทพากย์ด้านบนเพื่อแสดงตัวหนังสือขนาดใหญ่ที่นี่...';
}

function encodeWAV(samples, sr) {
  var buffer = new ArrayBuffer(44 + samples.length * 2);
  var view = new DataView(buffer);
  function writeString(v, offset, str) {
    for (var i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
  }
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sr, true);
  view.setUint32(28, sr * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(view, 36, 'data');
  view.setUint32(40, samples.length * 2, true);
  var offset = 44;
  for (var i = 0; i < samples.length; i++, offset += 2) {
    var s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}

function addClip(name, blob) {
  var url = URL.createObjectURL(blob);
  var id = 'c' + Date.now();
  clips.unshift({ id: id, name: name, url: url, blob: blob });

  var opts = clips.map(function(c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
  document.getElementById('sel').innerHTML = opts;
  document.getElementById('ref-sel').innerHTML = opts;

  document.getElementById('list').innerHTML = clips.map(function(c) {
    return '<div style="padding:12px;border:2px solid #22c55e;border-radius:10px;margin-top:10px;background:#f0fdf4;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<b>✅ ' + c.name + '</b>' +
      '<a href="' + c.url + '" download="' + c.name + '.wav" style="background:#2563eb;color:#fff;padding:5px 10px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:bold;">⬇️ เซฟไฟล์เสียง</a>' +
      '</div>' +
      '<audio controls src="' + c.url + '" style="width:100%;margin:8px 0;"></audio>' +
      '<div style="display:flex;gap:6px;">' +
      '<button onclick="tab(2)" style="flex:1;padding:10px;border:none;border-radius:8px;background:#7c3aed;color:#fff;font-weight:bold;">🎛️ ไปปรับเสียงให้หล่อ/ใส (แท็บ 2)</button>' +
      '<button onclick="tab(3)" style="flex:1;padding:10px;border:none;border-radius:8px;background:#16a34a;color:#fff;font-weight:bold;">🎬 ไปรวมใส่คลิปเลย (แท็บ 3)</button>' +
      '</div></div>';
  }).join('');
}

async function recStart() {
  if (isRec) return;
  try {
    document.getElementById('msg').innerText = '⏳ กำลังเปิดไมโครโฟน...';
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    sampleRate = audioCtx.sampleRate || 44100;
    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
    pcmData = [];

    processorNode.onaudioprocess = function(e) {
      if (!isRec) return;
      var input = e.inputBuffer.getChannelData(0);
      pcmData.push(new Float32Array(input));
    };

    sourceNode.connect(processorNode);
    processorNode.connect(audioCtx.destination);

    isRec = true;
    t0 = Date.now();
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-start').style.opacity = '0.4';
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('btn-stop').style.opacity = '1';
    document.getElementById('msg').innerText = '🔴 กำลังอัดเสียง... อ่านตามบทด้านบน แล้วกดปุ่มสีแดงเพื่อหยุด';

    tId = setInterval(function() {
      var sec = (Date.now() - t0) / 1000;
      document.getElementById('tm').innerText = sec.toFixed(1) + ' / 60.0 วินาที';
      if (sec >= 60) recStop();
    }, 100);
  } catch (e) {
    isRec = false;
    alert('เปิดไมค์ไม่ได้ (' + e.message + ') กรุณากดอนุญาตการใช้ไมโครโฟน หรือเลือกไฟล์เสียงด้านล่างแทนครับ');
  }
}

function recStop() {
  if (!isRec) return;
  isRec = false;
  if (tId) { clearInterval(tId); tId = null; }

  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-start').style.opacity = '1';
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-stop').style.opacity = '0.4';

  try {
    if (processorNode) processorNode.disconnect();
    if (sourceNode) sourceNode.disconnect();
    if (mediaStream) mediaStream.getTracks().forEach(function(t) { t.stop(); });
    if (audioCtx) audioCtx.close();
  } catch (e) {}

  var totalLen = 0;
  for (var i = 0; i < pcmData.length; i++) totalLen += pcmData[i].length;

  if (totalLen === 0) {
    document.getElementById('msg').innerText = '⚠️ ไม่พบสัญญาณเสียง กรุณาลองกดอัดใหม่อีกครั้งครับ';
    return;
  }

  var merged = new Float32Array(totalLen);
  var offset = 0;
  for (var j = 0; j < pcmData.length; j++) {
    merged.set(pcmData[j], offset);
    offset += pcmData[j].length;
  }

  var wavBlob = encodeWAV(merged, sampleRate);
  addClip('เสียงพากย์ #' + (clips.length + 1), wavBlob);
  document.getElementById('msg').innerText = '🎉 เซฟไฟล์เสียงสำเร็จแล้ว! กดปุ่มสีม่วงหรือสีเขียวในกล่องด้านล่างได้เลย';
}

function upAud(el) {
  var f = el.files && el.files[0];
  if (f) {
    addClip('เสียงนำเข้า (' + f.name + ')', f);
    document.getElementById('msg').innerText = '🎉 นำเข้าไฟล์เสียงสำเร็จ!';
  }
}

function setPreset(bass, clarity, speed) {
  document.getElementById('eq-bass').value = bass;
  document.getElementById('eq-clarity').value = clarity;
  document.getElementById('eq-speed').value = speed;
  updateLabels();
}

function updateLabels() {
  document.getElementById('lbl-bass').innerText = document.getElementById('eq-bass').value + ' dB';
  document.getElementById('lbl-clarity').innerText = document.getElementById('eq-clarity').value + ' dB';
  document.getElementById('lbl-speed').innerText = Number(document.getElementById('eq-speed').value).toFixed(2) + 'x';
}
